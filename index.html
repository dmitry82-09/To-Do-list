<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To‑Do List</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <h1>Мои задачи</h1>

        <!-- Панель управления (форма + поиск) -->
        <div class="controls">
            <form id="taskForm">
                <input type="text" id="taskInput" placeholder="Новая задача..." required />
                <button type="submit">Добавить</button>
            </form>
            <input type="text" id="searchInput" placeholder="Поиск задач..." />
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Завершённые</button>
        </div>

        <!-- Список задач -->
        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
